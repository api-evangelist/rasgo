aid: rasgo
name: Rasgo
description: >-
  Rasgo is an AI-powered Copilot for your data warehouse, letting teams query and analyze
  their data through natural-language interfaces while the data stays inside their existing
  warehouse. The Rasgo AI agent translates data-warehouse metadata into an LLM-friendly form
  and can be trained on a specific business domain through natural-language notes. It
  supports Snowflake and BigQuery (with Redshift and Delta Lake via Databricks on the
  roadmap) and integrates with OpenAI, Anthropic, Gemini, and dbt Cloud. Rasgo also offers a
  beta HTTP API (Enterprise plans and above) and an official Python SDK, pyrasgo, that grew
  out of its earlier data feature-engineering product line. Rasgo is backed by Insight
  Partners.
